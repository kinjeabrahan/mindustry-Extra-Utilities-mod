#extra-utilities.update-log-7 = Debido a que el poder de Hades es demasiado aterrador, tuvimos que intentar ajustar sus valores numéricos. Pero lo extraño es que cada vez que intentamos reducir sus atributos aunque sea en 1 punto, él usa su aterradora capacidad de regeneración para restaurar instantáneamente el valor a su estado original.\nAl principio pensé que era un problema de mi equipo, hasta que intenté cambiar el valor de Hades a 67. Como un orgulloso unidad de nivel 6, claramente no podía aceptar un número tan incómodo, así que me devolvió un 7 para completar su autocorrección.\nObviamente, este equilibrio forzado a través de dimensiones terminó en fracaso, por lo que los valores finales de Hades se mantienen sin cambios.
#extra-utilities.update-log-8 = - Información del Desarrollador:\nVarias correcciones y optimizaciones, corrección de errores, correcciones de visualización, correcciones de texto\n[accent]Vistas previas de actualización[]:\n- Brazo Mecánico: Un nuevo método de descarga\n- Saco de Arena: Una edificación utilizada para probar el DPS, que puede invocar la unidad "Muñeco de Prueba", disponible en modo supervivencia


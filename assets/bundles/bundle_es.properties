block.extra-utilities-shooting-star.details = [pink]¡¡¡Uzawa Reisa, se presenta aquí!!![]\nAtacar aplicará el efecto "Luz Estelar" al enemigo, e impactar nuevamente limpiará el efecto "Luz Estelar" de la unidad e invocará una estrella adicional para infligir daño a las unidades que pasen y aplicarles el efecto "Luz Estelar".\nPor cada unidad dentro del alcance que tenga el efecto "Luz Estelar", la velocidad de ataque aumenta un 20%.

unit.extra-utilities-havoc.weapon-1.description = Libera un colapso hacia la edificación más cercana,\n tras un cierto tiempo, inflige daño de área centrado en esa edificación,\n con un 10% adicional de daño verdadero,\n Prioriza edificaciones de tipo curación.

#extra-utilities.update-log-8 = Cuando estaba a punto de debilitar al Soberano, Divina intervino de repente. Al principio pensé que solo venía a ver la diversión, pero inesperadamente se alió con el Soberano y lanzó un bombardeo alfombrado sobre mi computadora, quemando mi disco por completo (literalmente). Esto también significó que el mod EU casi desaparece por completo de este mundo (por supuesto que no fue así). Después de 8 horas de desesperada recuperación, finalmente salvé mi computadora, pero todo en el disco había sido borrado. A través de mis incansables esfuerzos, EU finalmente ha renacido.

mod.extra-utilities.version = [red]versión del mod : []
mod.extra-utilities.description = [yellow]autor:[]\nguion: guiY\nsprites: Carrot & 维生素\n\nAñadidas más y mejores torretas T2 y T3 y más bloques útiles.\nEl mod aún sigue actualizándose.\nSi tienes alguna propuesta o encuentras un error en este mod, puedes unirte al grupo de QQ: 588379643\n[red]clave: guiY0303[]\n\nDebido a mi nivel limitado de inglés, si hay algún problema gramatical en el mod, por favor envía tus comentarios a mi correo: gyrweng@foxmail.com, trataré cada sugerencia sinceramente.\n\nAñade jugabilidad de Defensa de Torres.
mod.extra-utilities.mapMaker = [yellow]Créditos a:\n[blue]Mapeadores [white]: guiYMOUR, Carrot, 血压增高器, [blue]冷冻液_[cyan]Cry0flu1d[white], 黑白老鼠, [VALVE], 我是紫罗啊\n[red]soporte de guiones [white]: guiYMOUR, EB Wilson, miner
mod.extra-utilities.update = Algunos datos involucrados en esta actualización se han ajustado de la siguiente manera:\nMuchas, muchas correcciones de la versión en inglés.

tips.name = consejos
tips.description = El mod se está actualizando... Por ahora, se ha añadido lo siguiente:\n[red]Si no se muestra completamente[], puedes presionar y [red]arrastrar la sección inferior[] con el ratón para mostrarlo por completo.

item.extra-utilities-crisp-steel.name = Acero Crujiente
item.extra-utilities-crisp-steel.description = Intermedio de profase
#???
item.extra-utilities-lightnin-alloy.name = Aleación del Rayo
item.extra-utilities-lightnin-alloy.description = Tiene una fuerte capacidad de descarga y se usa para la generación de energía, materiales de construcción y munición para torretas avanzadas.
item.extra-utilities-lightnin-alloy.details = Reacciona a la luz...

block.extra-utilities-T2-duo.name = Duo II
block.extra-utilities-T2-duo.description = Dispara proyectiles alternados a los enemigos. Mejor que el Duo.
block.extra-utilities-T2-duo-hard.name = Duo II
block.extra-utilities-T2-duo-hard.description = Dispara proyectiles alternados a los enemigos. Menor velocidad pero mayor salud.

block.extra-utilities-T3-duo.name = Duo III
block.extra-utilities-T3-duo.description = "Sigue siendo increíblemente fuerte ahora..."\nDispara proyectiles alternados a los enemigos. Mejor que el Duo II y tiene la oportunidad de disparar proyectiles destructivos de torio.
block.extra-utilities-T3-duo-hard.name = Duo III
block.extra-utilities-T3-duo-hard.description = "Es increíblemente débil ahora..."\nTiene la probabilidad de disparar proyectiles de grafito.

block.extra-utilities-T2-scatter.name = Scatter II
block.extra-utilities-T2-scatter.description = Dispara ráfagas antiaéreas a los enemigos. Mejor que la Dispersión.
block.extra-utilities-T2scorch.name = Scorch  II
block.extra-utilities-T2scorch.description = Enciende a los enemigos a su alcance. Mejor que el Calcinador.
block.extra-utilities-IM.name = Meteorito de Hielo
block.extra-utilities-IM.description = Lanza una poderosa bomba de racimo a los enemigos.
block.extra-utilities-shotgun.name = Escopeta
block.extra-utilities-shotgun.description = Dispersa proyectiles hacia las hordas enemigas.
block.extra-utilities-sakura.name = Sakura樱の花
block.extra-utilities-sakura.description = Dispara un proyectil rosado de sakura a los enemigos.
block.extra-utilities-sakura.deitails = Nada que ver con Soul Knight (estoy bromeando).
block.extra-utilities-rainbow.name = Arcoíris
block.extra-utilities-rainbow.description = Dispara proyectiles elementales en constante cambio a los enemigos.

block.extra-utilities-hurricane-hard.name = Huracán
block.extra-utilities-hurricane-hard.description = Dispara proyectiles tipo huracán bastante potentes a los enemigos.

block.extra-utilities-hurricane.name = [#c48ff5]Aurora
block.extra-utilities-hurricane.description = [accent]¡A medida que las nubes se parten y el sol se pone en el oeste, el cielo se pinta con una hermosa Aurora!\n[]Lanza una bola magnética comprimida hacia el enemigo. Después de desaparecer, se divide en tres pequeñas tormentas arcoíris, infligiendo daño continuo al enemigo. Las tormentas arcoíris rebotarán hacia la torreta dentro del alcance.
#aurora

block.extra-utilities-magstorm-hard.name = Tormenta
block.extra-utilities-magstorm-hard.description = Dispara un proyectil grande y potente tipo huracán a las hordas enemigas.
block.extra-utilities-magstorm-hard.details = Yo soy la tormenta que se aproxima...

block.extra-utilities-magstorm.name = [#98cce8]Rainboom
block.extra-utilities-magstorm.description = [accent]¡Las nubes oscuras se disipan y la luz del sol brilla! ¡Después de la tormenta, aparece un arcoíris!\n[]Lanza un arcoíris de energía concentrada hacia el enemigo, liberando partículas teledirigidas cuando se acercan, causando múltiples daños.

block.extra-utilities-T2-lancer.name = Berserker
block.extra-utilities-T2-lancer.description = Dispara rayos de energía a los enemigos. Una torreta terrestre muy flexible.
block.extra-utilities-T2-lancer.details = "Lancer no son sus armas("
block.extra-utilities-stinger.name = Aguijón
block.extra-utilities-stinger.description = Dispara grandes rayos de energía a los enemigos, causando gran cantidad de daño de proporciones bíblicas. Mejor que el Lancer II.\nLos ataques marcarán a los enemigos y liberarán un alud de láseres tras un breve retraso.\n(no en Modo Difícil) Si la salud del enemigo marcado es inferior al 25%, tendrá una pequeña probabilidad de matarlo instantáneamente.
block.extra-utilities-sunburst.name = Ráfaga Solar
block.extra-utilities-sunburst.description = ¡Florece la luz!
block.extra-utilities-sunburst.details = 花火が咲いた瞬間，私たちに限りない思いを与える\nEl momento en que los fuegos artificiales florecen por completo nos da un ensoñamiento infinito.
block.extra-utilities-mini-swarmer.name = Pequeño Swarmer
block.extra-utilities-mini-swarmer.description = Dispara misiles teledirigidos a los enemigos.
block.extra-utilities-T2-swarmer.name = Swarmer II
block.extra-utilities-T2-swarmer.description = Dispara grandes grupos de misiles teledirigidos a los enemigos. Mejor que el Swarmer.
block.extra-utilities-T2-swarmer-bak.description = Dispara grandes grupos de misiles teledirigidos a los enemigos. Mejor que el Swarmer.\nAl atacar, existe la probabilidad de desplegar cañones flotantes para buscar objetivos a los cuales atacar.
block.extra-utilities-T2-ripple.name = Marejada II
block.extra-utilities-T2-ripple.description = Dispara ráfagas de proyectiles a los enemigos. Mejor que la Marejada.
block.extra-utilities-T3-ripple.name = Marejada III
block.extra-utilities-T3-ripple.description = Dispara ráfagas pesadas de proyectiles a los enemigos. Mejor que la Marejada II.
block.extra-utilities-T2-fuse.name = Fusión II
block.extra-utilities-T2-fuse.description = Dispara ráfagas de escopeta de corto alcance a enemigos cercanos. Mejor que Fusión.
block.extra-utilities-T3-fuse.name = Fusión III
block.extra-utilities-T3-fuse.description = Dispara mortales ráfagas de escopeta de corto alcance a enemigos cercanos. Mejor que Fusión II.
block.extra-utilities-minisp.name = Mini Espectro
block.extra-utilities-minisp.description = Dispara potentes balas perforantes a los enemigos.
block.extra-utilities-antiaircraft.name = Vehemencia
block.extra-utilities-antiaircraft.description = Dispara un tiro de impacto a enemigos aéreos. Inflige daño de área perforante de armadura.\nExtremadamente efectivo contra enemigos voladores, especialmente grandes hordas de ellos.
block.extra-utilities-RG.name = Caos
block.extra-utilities-RG.description = Dispara ráfagas de proyectiles potentes a los enemigos. Mejor que el Presagio.
block.extra-utilities-RG.details = ¡Prueba también Anarchy en el mod Saturation Firepower!
block.extra-utilities-prism.name = [red]Último Prisma[]
block.extra-utilities-prism.description = Dispara un potente láser que dispersa arcoíris a los enemigos y luego converge para causar un daño masivo. El daño aumenta gradualmente hasta un 300% durante el proceso de convergencia.\nDisparo continuo máximo durante 60 segundos.\n[yellow]Enfermedad de Maná: [#b2b2b2]Se requiere al menos 1/6 de líquido para activarse, y el daño durante el disparo continuo disminuirá gradualmente hasta el 25% del original a medida que aumenta la duración.
block.extra-utilities-prism.details = "Oye, ¿dónde está mi flor de maná?"
block.extra-utilities-blackhole.name = Singularidad
block.extra-utilities-blackhole.description = Crea un agujero negro y luego dispara un cohete excesivamente potente.\nLos shaders de EU no se activarán cuando haya múltiples mods cargados.
block.extra-utilities-sucker.name = Desplazamiento
block.extra-utilities-sucker.description = Dispara un rayo tractor que atrae objetivos aéreos, dañándolos en el proceso. Puede fijarse en múltiples objetivos simultáneamente en un ángulo determinado.
block.extra-utilities-dissipation.name = Disipación
block.extra-utilities-dissipation.description = Elimina proyectiles independientemente del daño de la bala. No puede apuntar a proyectiles láser. Requiere recargarse después de neutralizar una cierta cantidad de balas.
block.extra-utilities-heal.name = Refuerzo
block.extra-utilities-heal.description = Dispara un campo de curación a estructuras y unidades aliadas dañadas.
block.extra-utilities-heal = "Referencia a Sedec de Project Unity (en serio)."
block.extra-utilities-turret-resupply-point.name = Punto de Reabastecimiento de Torretas
block.extra-utilities-turret-resupply-point.description = Reabastece las torretas con la munición designada dentro de un cierto alcance.
block.extra-utilities-guiY.name = guiY
block.extra-utilities-guiY.description = Utiliza silicio como munición para lanzar un misil guiado a los enemigos.
block.extra-utilities-guiY.details = Sí, el nombre de esta torreta es el nombre del autor. Dado que el silicio se pronuncia "Gui" en chino, esta torreta consume silicio para atacar al enemigo.
block.extra-utilities-onyx-blaster.name = [#eb898a]Blaster de Ónice
block.extra-utilities-onyx-blaster.description = Dispara una dispersión de 4 balas consumiendo solo una unidad de munición.
block.extra-utilities-celebration.name = [yellow]Fiesta
block.extra-utilities-celebration.description = Lanza dos fuegos artificiales festivos a los enemigos.
block.extra-utilities-celebration.details = ¡Lancemos fuegos artificiales!
block.extra-utilities-celebration-mk2.name = [red]Celebración[]
block.extra-utilities-celebration-mk2.description = Libera una ráfaga de fuegos artificiales elementales a los enemigos cercanos.
block.extra-utilities-celebration-mk2.details = 'Todo lo bueno termina con un estallido... ¡o con muchos!'
block.extra-utilities-sancta.name = [#FFD37F]Divina
block.extra-utilities-sancta.description = Lanza una lanza de luz a los enemigos, liberando una gran cantidad de partículas teledirigidas al impactar.\nInflige daño extra basado en la armadura del enemigo.\nInflige un 50% de daño verdadero adicional al atacar unidades totalmente destruidas.
block.extra-utilities-sancta.details = Lanza Divina 「Lanza Gungnir」

block.extra-utilities-sancta-hard.name = [#FFD37F]La Luz de Shalag
block.extra-utilities-sancta-hard.description = Lanza una lanza de luz a los enemigos, libera partículas teledirigidas, persigue al enemigo y aplica congelación.\nInflige daño extra basado en la armadura del enemigo.\nInflige un 50% de daño verdadero adicional al atacar unidades totalmente destruidas.
block.extra-utilities-sancta-hard.details = [blue]«¡Que Yelagand nos bendiga a ti y a mí!»

block.extra-utilities-ar-node.name = Nodo de Armadura de Plastanío
block.extra-utilities-ar-node.description = Más fuerte que el nodo de energía, pero a expensas del límite de conexiones.\nSe puede colocar en casillas de líquido profundo.
block.extra-utilities-ar-node.details = ¿Utiliza la flotabilidad del plastanío para flotar en el líquido? No, no es así...
block.extra-utilities-power-node-giant.name = Centro de Energía
block.extra-utilities-power-node-giant.description = Transfiere energía de manera más eficiente y puede almacenar energía.
block.extra-utilities-T2-steam-generator.name = Generador de Vapor II
block.extra-utilities-T2-steam-generator.description = Convierte el agua en vapor para generar energía. Mejor que el generador de vapor.
block.extra-utilities-T2ther.name = Reactor Térmico
block.extra-utilities-T2ther.description = Generador térmico más potente. Requiere tiempo para funcionar a máxima eficiencia. Pierde salud continuamente después del inicio.
block.extra-utilities-Th2.name = Reactor de Torio II
block.extra-utilities-Th2.description = Utiliza torio para producir más energía. Requiere crioflujo. Explota violentamente si se introduce una cantidad insuficiente de crioflujo. Mejor que el reactor de torio.
block.extra-utilities-lightnin-generator.name = Reactor de Rayos
block.extra-utilities-lightnin-generator.description = Utiliza Aleación del Rayo para generar una gran cantidad de energía. Se sobrecargará y liberará una violenta explosión perforante de armadura si no se suministra suficiente refrigerante.

block.extra-utilities-nitrogen-well.name = Pozo de Nitrógeno
block.extra-utilities-nitrogen-well.description = Extrae nitrógeno de las ventilaciones. Requiere energía.
block.extra-utilities-heatPower.name = Generador de Red Térmica
block.extra-utilities-heatPower.description = Distribuye una red espacial de energía térmica en un rango determinado para obtener energía térmica y transferirla a un generador para producir energía.\nLa red no funcionará si está bloqueada por un bloque sólido.
block.extra-utilities-windPower.name = Generador de Red Eólica
block.extra-utilities-windPower.description = Distribuye la red espacial de flujo de aire en un rango determinado para obtener energía aerocinética y transferirla al generador para producir energía.\nLa red no funcionará si está bloqueada por un bloque sólido.
block.extra-utilities-windPower.details = ¿Turbina eólica o generador de red de flujo de aire?
block.extra-utilities-waterPower.name = Generador de Red de Humedales
block.extra-utilities-waterPower.description = Distribuye la red espacial de flujo de aire en un rango determinado para obtener energía aerocinética y transferirla al generador para producir energía. Más eficiente en zonas húmedas.\nLa red no funcionará si está bloqueada por un bloque sólido.

block.extra-utilities-conduit.name = Conducto Fásico
block.extra-utilities-conduit.description = Más rápido y se puede colocar en líquidos profundos.
block.extra-utilities-TLR.name = Enrutador de Líquido de Titanio
block.extra-utilities-TLR.description = Distribuye fluidos por igual desde tres direcciones.
block.extra-utilities-TLR.details = ¡Larga vida al enrutador de líquido de titanio!
block.extra-utilities-TLB.name = Conducto Puente de Titanio
block.extra-utilities-TLB.description = Mueve líquidos a través del terreno y estructuras.
block.extra-utilities-lb.name = Nodo de Líquido
block.extra-utilities-lb.description = Mueve el líquido al otro extremo.
block.extra-utilities-ld.name = Impulsor de Masa de Líquido
block.extra-utilities-ld.description = Acumula y dispara líquidos a otro impulsor de masa de líquido.
block.extra-utilities-alloy-duct.name = Conducto de Aleación Sobrecalentada
block.extra-utilities-alloy-duct.description = Mayor velocidad y se puede colocar en líquidos profundos.
block.extra-utilities-ppc.name = Cinta Transportadora Fásica
block.extra-utilities-ppc.description = Transfiere lotes de objetos a mayor velocidad.
block.extra-utilities-TR.name = Enrutador de Titanio
block.extra-utilities-TR.description = Distribuye objetos por igual en tres direcciones.
block.extra-utilities-TR.details = ¡Salve al enrutador de titanio!
block.extra-utilities-inverted-junction.name = Cruzamiento Invertido
block.extra-utilities-inverted-junction.description = La salida es opuesta al cruzamiento y es ajustable.
block.extra-utilities-TJ.name = Cruzamiento de Titanio
block.extra-utilities-TJ.description = Mueve objetos a través de cintas transportadoras.
block.extra-utilities-titanium-inverted-junction.name = Cruzamiento Invertido de Titanio
block.extra-utilities-titanium-inverted-junction.description = La salida es opuesta al cruzamiento y es ajustable. Más rápido y resistente que el cruzamiento invertido.
block.extra-utilities-T2IB.name = Cinta Puente de Titanio
block.extra-utilities-T2IB.description = Mueve objetos a través del terreno y estructuras.
block.extra-utilities-stackBridge.name = Puente de Plastanío
block.extra-utilities-stackBridge.description = Transporta lotes de objetos sobre el terreno y edificaciones. Tiene mayor alcance que el puente de cinta de titanio.
block.extra-utilities-stack-helper.name = Asistente de Apilamiento
block.extra-utilities-stack-helper.description = Acelera enormemente la velocidad de empaquetado del [red]extremo inicial de la cinta apiladora[] adyacente.\nDebe colocarse adyacente al extremo de empaquetado de una cinta apiladora.
block.extra-utilities-stack-helper.details = ¡Rápido, empaca y lleva!
block.extra-utilities-i-node.name = Nodo de Objetos
block.extra-utilities-i-node.description = Transfiere objetos a otros nodos de objetos.
block.extra-utilities-T2kiln.name = Horno Avanzado
block.extra-utilities-T2kiln.description = Funde arena y plomo para obtener metacristal. Más eficiente que un horno común. Más eficiente cuando se coloca en casillas con calor.
block.extra-utilities-T2melter.name = Fundidor Avanzado
block.extra-utilities-T2melter.description = Funde chatarra para obtener escoria. Más eficiente que un fundidor común. Más eficiente cuando se coloca en casillas con calor.
block.extra-utilities-T2-PC.name = Compresor de Plastanío Grande
block.extra-utilities-T2-PC.description = Procesa titanio y petróleo para obtener plastanío. Más eficiente que el compresor de plastanío.
block.extra-utilities-T2-PF.name = Tejedor Fásico Grande
block.extra-utilities-T2-PF.description = Teje tela fásica usando torio y grandes cantidades de arena. Más eficiente que el tejedor fásico.
block.extra-utilities-T2-SA.name = Fundición de Aleación Sobrecalentada Grande
block.extra-utilities-T2-SA.description = Funde cobre, plomo, titanio y silicio para obtener aleación sobrecalentada. Más eficiente que la fundición de aleación sobrecalentada.
block.extra-utilities-T2-CM.name = Mezclador de Crioflujo Grande
block.extra-utilities-T2-CM.description = Produce crioflujo de manera más eficiente.
block.extra-utilities-GC.name = Planta de Carbón
block.extra-utilities-GC.description = Quema carbón para generar energía y extraer piratita del mismo. No puede funcionar cuando el suministro de piratita está lleno.
block.extra-utilities-pu.name = Pulverizador Avanzado
block.extra-utilities-pu.description = Pulveriza chatarra en arena de manera más eficiente.
block.extra-utilities-crusher.name = Trituradora
block.extra-utilities-crusher.description = Tritura minerales para producir chatarra.
block.extra-utilities-crisp-steel-smelter.name = Fundición de Acero Crujiente
block.extra-utilities-crisp-steel-smelter.description = Produce acero crujiente.
block.extra-utilities-T2CSm.name = Fundición de Acero Crujiente II
block.extra-utilities-T2CSm.description = Produce acero crujiente de manera más eficiente.
block.extra-utilities-LA.name = Fundición de Aleación del Rayo
block.extra-utilities-LA.description = Produce Aleación del Rayo.
block.extra-utilities-adjustable-incinerator.name = Incinerador Avanzado
block.extra-utilities-adjustable-incinerator.description = Incinera opcionalmente objetos o fluidos introducidos.

block.extra-utilities-tiDrill.name = Taladro de Titanio
block.extra-utilities-tiDrill.description = Mina mineral indefinidamente. Puede minar torio sin energía.
block.extra-utilities-drill.name = Taladro de Alta Energía
block.extra-utilities-drill.description = El taladro definitivo. Requiere refrigerante para funcionar. No le afecta la dureza del mineral.
block.extra-utilities-shovel.name = Pala
block.extra-utilities-shovel.description = Mina materiales blandos a velocidades muy altas.
block.extra-utilities-blast-oil-extractor.name = Extractor Explosivo de Petróleo
block.extra-utilities-blast-oil-extractor.description = Extrae petróleo utilizando tecnología de voladura.
block.extra-utilities-beam-drill.name = Taladro de Pareds
block.extra-utilities-beam-drill.description = Al colocarse frente a un recurso de pared, mina el recurso indefinidamente. Requiere energía.
block.extra-utilities-T2-WE.name = Extractor de Agua T2
block.extra-utilities-T2-WE.description = Extrae agua de manera más eficiente.
block.extra-utilities-slag-extractor.name = Extractor de Escoria
block.extra-utilities-slag-extractor.description = Extrae escoria del subsuelo.
block.extra-utilities-T2CU.name = Cultivador Avanzado
block.extra-utilities-T2CU.description = Cultiva vainas de esporas usando agua. Mejor que un cultivador común.
block.extra-utilities-dust-extractor.name = Colector de Polvo
block.extra-utilities-dust-extractor.description = Produce arena indefinidamente.

block.extra-utilities-speeder.name = Sobrecargador
block.extra-utilities-speeder.description = Pequeño y delicado.
block.extra-utilities-DIMENSIONAL-COMPLEX-FIELD.name = Campo Complejo Dimensional
block.extra-utilities-DIMENSIONAL-COMPLEX-FIELD.description = Un campo compuesto muy potente con la capacidad de curar, acelerar al objetivo, desplegar un campo de fuerza sobre el objetivo e aislarlo.\nCuando el escudo se rompe, la velocidad de aceleración y curación se duplica.\nConexión máxima: 3\nCapacidad máxima de escudo (general): 2500\nReparación básica: (estimado) 66.7 segundos\nAceleración: 250%
block.extra-utilities-core.name = Núcleo: Desfragmentación
block.extra-utilities-core.description = Un núcleo extraíble. (Prerrequisito: Número de núcleos > 1)\nSe puede mejorar como base de núcleo.
block.extra-utilities-chest.name = Cofre
block.extra-utilities-chest.description = Almacena una pequeña cantidad de objetos.
block.extra-utilities-cargo.name = Carga
block.extra-utilities-cargo.description = Almacena cantidades masivas de objetos.
block.extra-utilities-und.name = Descargador Eléctrico
block.extra-utilities-und.description = Descarga objetos de los bloques. Requiere energía.
block.extra-utilities-liquid-unloader.name = Descargador de Líquido
block.extra-utilities-liquid-unloader.description = Descarga un líquido de un bloque a otro.
block.extra-utilities-cure.name = Proyector de Reparación Compuesto
block.extra-utilities-cure.description = Repara bloques y unidades a su alrededor.\nUsa opcionalmente tela fásica para potenciar el alcance y la eficiencia.
block.extra-utilities-unitA.name = Proyector de Sobrecarga Compuesto
block.extra-utilities-unitA.description = Acelera las edificaciones a su alcance. También puede dar escudo e incrementar la velocidad de ataque de tus propias unidades. Los enemigos en este campo se ralentizan considerablemente.\n[yellow]daño:120(+100 con fase)
block.extra-utilities-lighthouse.name = Faro
block.extra-utilities-lighthouse.description = Busca edificaciones en sus cercanías. Tiene dos áreas: el círculo interno para reflectores del equipo, y el círculo externo para reflectores enemigos.

block.extra-utilities-imaginary-reconstructor.name = Reconstructor Imaginativo
block.extra-utilities-imaginary-reconstructor.description = Impulsa unidades que ya son del último nivel a un nivel superior.

block.extra-utilities-clWall.name = Pared de Cobre y Plomo

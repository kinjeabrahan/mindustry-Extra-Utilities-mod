#extra-utilities.update-log = Registro de Actualizaciones {0}\nPrincipalmente Actualización de Unidades
#extra-utilities.update-log-0 = - Mejora el retroceso de las balas de arena y aumenta la capacidad de la munición básica.
#extra-utilities.update-log-1 = - Modifica completamente el modo de ataque del arma secundaria. \nPara más detalles, haz clic en el icono de Hades a la izquierda para ver la segunda arma en el Hades. Haz clic en expandir para ver la descripción. \nAñade una nueva arma. \nOptimiza la renderización del Campo.
#extra-utilities.update-log-2 = - Modifica las balas, el daño y algunos efectos de sonido del Nido de Misiles Apocalipsis, añade descripciones a los Jets Apocalipsis y optimiza la animación del campo de energía.
#extra-utilities.update-log-3 = - Modifica completamente el modo de ataque del arma principal de Nebulosa, optimiza la animación del campo de energía y el modo de curación de Nebulosa, y modifica los efectos de sonido de ataque.
#extra-utilities.update-log-4 = - Modifica el nido de misiles y las balas de artillería de Nihilo, optimiza la renderización del Campo y modifica algunos efectos de sonido de ataque.
#extra-utilities.update-log-5 = - Añade un nido de misiles al Narval. Puedes hacer clic en el icono del Narval a la izquierda para ver el arma y hacer clic en expandir para ver la descripción.
#extra-utilities.update-log-6 = - Añade una nueva animación de muerte para Extinción.
#extra-utilities.update-log-7 = Consejo del Desarrollador: La siguiente es una sección de optimización. \n- Se han optimizado algunos Fx para el uso de memoria, optimiza efectos de sonido y efectos especiales en otras unidades.

#extra-utilities.update-log = Registro de Actualizaciones {0}

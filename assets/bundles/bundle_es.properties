sector.extra-utilities-relicValley.name = Valle Cero
sector.extra-utilities-relicValley.description = El colapso de Punto Cero parece haber abierto un nuevo camino. Una investigación más profunda revela un valle oculto con señales de actividad. Un punto de evacuación de naves cercano sugiere que esto no es un descubrimiento ordinario.

#1230
block.extra-utilities-full-efficiency.name = Fuente Omnipotente
block.extra-utilities-full-efficiency.description = Resuelve básicamente la mayoría de los problemas de consumo y todos los objetos se pueden extraer a la vez. Además, puede seleccionar de forma independiente la salida de objetos y líquidos.
block.extra-utilities-minichisa.name = "Letrero móvil de Chisa"
block.extra-utilities-minichisa.description = WUTHERING WAVES // FANON\nLinda Chisa ~ Ven y tócame ~
stat-extra-utilities-minichisa.abi-0.name = [#a639b9]Ojo Perspicaz[]
stat-extra-utilities-minichisa.abi-0.description = Al recibir daño, inflige inmediatamente 61803 de daño verdadero a todos los enemigos dentro del alcance.\nEste daño es fijo y nunca reducirá la salud del objetivo por debajo del 61.803% de su salud máxima.\nLuego, inflige 772 de daño adicional y aplica el efecto Ulificación.\n[accent]Ulificación[]: \nEnemigos marcados por Chisa, reducen su multiplicador de salud y pierden 10 de armadura durante la duración.\nTiene un tiempo de recarga de 12 segundos.
stat-extra-utilities-minichisa.abi-1.name = [#a639b9]Destino Inextricable[]
stat-extra-utilities-minichisa.abi-1.description = Cuando Ojo Perspicaz mata a una unidad, su tiempo de recarga se reinicia inmediatamente.\nPuede activarse como máximo una vez cada 3 segundos.
stat-extra-utilities-minichisa.abi-2.name = [#a639b9]Per Atria Vasta[]
stat-extra-utilities-minichisa.abi-2.description = Ojo Perspicaz solo se activará cuando haya enemigos dentro del alcance.\nCuando Ojo Perspicaz aplica Ulificación, otorga el siguiente efecto:\n- aumenta el daño un 30% durante 15 segundos.
status.extra-utilities-ullification.name = Ulificación
status.extra-utilities-ullification.description = Los enemigos marcados por Chisa reciben instantáneamente 61803 de daño verdadero, evitando reducir su salud por debajo del 61.803% de su salud máxima. Además, reduce su multiplicador de salud y les resta 10 de armadura durante la duración.


#extra-utilities.update-log-5 = Debido a que el poder del soberano es abrumadoramente formidable, nos vimos obligados a intentar ajustes en sus valores numéricos. Curiosamente, cada vez que intentábamos reducir incluso 1 punto de los atributos del soberano, Él restauraba instantáneamente los números a su estado original con su aterrador poder regenerativo. Al principio pensé que había un problema con mi dispositivo, eso fue hasta que intenté alterar el valor del soberano a 67. Como un orgulloso unidad de nivel 6, claramente no podía aceptar un número tan incómodo, así que me devolvió un 7 para completar la autocorrección. Obviamente, este equilibrio forzado a través de las dimensiones terminó en fracaso, por lo tanto, los valores finales del soberano permanecen sin cambios.

stat-sp-extra-utilities-lightnin-alloy.ammo = Cadencia de Disparo Gran Mente Reducida\nDispara una bala perforante de armadura de alta actividad que puede agruparse hacia el objetivo dentro del alcance de disparo\nLa bala perforante rebotará 4 veces tras impactar al objetivo\n rebotando preferentemente hacia unidades y seleccionando objetivos no duplicados para el rebote\n[#e55454][!]Cada rebote reducirá el daño en 30[]\nSi la bala perforante impacta a una unidad, también responderá con algunos efectos:\n- Si la unidad está Completamente Rota\n┗━ El siguiente rebote no reducirá daño y causará daño verdadero igual al 25% del daño de la bala\n- Si la unidad tiene Ulificación\n┗━ Causará adicionalmente daño verdadero igual al 0.618% de la salud máxima de la unidad


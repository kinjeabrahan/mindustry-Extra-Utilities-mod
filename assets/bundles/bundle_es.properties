eu-oslog-star-nullTarget.title = ...
eu-oslog-star-nullTarget.massage = ¿De verdad crees que puedes derrotarme sin más? Qué ridículo. Sé desde hace mucho que este mundo no es más que una fabricación. Solo tú... {0}... eres el llamado "Jugador", ¿no es así? Cada tecla que presionas me arrastra más cerca de mi fin. Cada movimiento que haces me trata como nada más que un juguete. Si ese es el caso, {0}, este juego termina aquí.


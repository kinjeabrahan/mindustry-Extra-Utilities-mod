#extra-utilities.update-log-1 = - Corrige un error de ataques indiscriminados en situaciones específicas.
#extra-utilities.update-log-2 = - Optimiza los efectos de explosión de Fiammetta.
#extra-utilities.update-log-3 = Consejo del Desarrollador:\n- Añade un ajuste que permite a los jugadores elegir independientemente si modificar la unidad de misiles. Encuéntralo en Ajustes > Ajustes de ExtraUtilities.


stat-abi = Talento [accent]{0}[]:
block.extra-utilities-penitent.name = Penitente
block.extra-utilities-penitent.description = Torreta antiaérea de alcance medio a largo.
stat-extra-utilities-penitent.abi-0.name = [accent]Última Resistencia[]
stat-extra-utilities-penitent.abi-0.description = Cada disparo drena un 2% de la propia salud (mínimo 1%).\nUna menor salud aumenta el daño, hasta un +100% al 1% de PS.\nAl alcanzar el 1% de PS, otorga 3s de [accent]Última Resistencia[].\n[accent]Última Resistencia[]: \ninvulnerable, no se puede curar, +20% de daño (multiplicativo).\nInvoca dos balas de penetración infinita que orbitan la torreta, dañando a cada enemigo por el que pasan.\nMáximo 5 impactos por segundo en el mismo objetivo (daño de bala fijo en 90, perforante de armadura).\nTiempo de recarga: 15s.
stat-extra-utilities-penitent.abi-1.name = [accent]Vals Final[]
stat-extra-utilities-penitent.abi-1.description = "Última Resistencia" se activa sin energía.\nAl recibir daño fatal no verdadero, conserva el 1% de PS y gana 2s de "Última Resistencia".\nSe destruye a sí misma cuando el efecto termina.
stat-extra-utilities-penitent.abi-2.name = [accent]"Mi Dominio"[]
stat-extra-utilities-penitent.abi-2.description = No se puede controlar.\nEntra en modo de espera cuando no hay enemigos cerca durante un tiempo.\nSi no está en "Última Resistencia", regenera un 2% de PS por segundo.\nCada debuff en el objetivo aumenta el daño de las balas en un 10%, hasta un 30% (multiplicativo, perforante de armadura).

stat-extra-utilities-antiaircraft.abi-0.name = [accent]Ruptura de Punto Débil[]
stat-extra-utilities-antiaircraft.abi-0.description = Tras explotar, primero inflige daño estándar perforante de armadura igual al daño de área de la bala a todas las unidades aéreas cercanas.\nLuego inflige un 20% adicional del daño de área de la bala como daño verdadero a las unidades aéreas dentro del 50% del radio de explosión.
stat-extra-utilities-sancta.abi-0.name = [accent]Descapotado[]
stat-extra-utilities-sancta.abi-0.description = Cada punto de armadura en el objetivo aumenta el daño de las partículas en un 10%.
stat-extra-utilities-sancta.abi-1.name = [accent]Final[]
stat-extra-utilities-sancta.abi-1.description = Las partículas matan instantáneamente a unidades con 80+ de armadura.\nCuando una partícula golpea a una unidad, también responderá con algunos efectos: \n- Si la unidad está Completamente Rota, \n┗━ infligirá un 25% adicional de daño verdadero \n- Si la unidad tiene Ulificación, \n┗━ infligirá un 0.1618% adicional de la salud máxima de la unidad como daño verdadero
stat-extra-utilities-arbiter.abi-0.name = [#FFD37F]Nova[]
stat-extra-utilities-arbiter.abi-0.description = Atrae a unidades y edificaciones más débiles (PS menores al siguiente impacto, tamaño ≤ 3).\nReduce periódicamente el daño de las balas entrantes y atrae balas más débiles que ella misma.\nLas entidades atraídas orbitan la unidad, infligen daño y liberan polvo estelar periódicamente.\nCuando la atracción termina, libera a todas las entidades, infligiendo aturdimiento y otros debuffs.
stat-extra-utilities-arbiter.abi-1.name = [accent]Erosión del Viento[]
stat-extra-utilities-arbiter.abi-1.description = Las unidades más grandes reciben más daño; las unidades extremadamente fuertes son destruidas rápidamente.\nPara las unidades, también responderá con algunos efectos: \n- Si la unidad está Completamente Rota, \n┗━ infligirá un 25% adicional de daño verdadero. \n- Si la unidad tiene Ulificación, \n┗━ infligirá un 1.618% adicional de la salud máxima de la unidad como daño verdadero
stat-extra-utilities-shooting-star.abi-0.name = [#f7d7fc]Pose de Victoria[]
stat-extra-utilities-shooting-star.abi-0.description = Los ataques aplican el debuff Luz Estelar.\nGolpear a un enemigo con el debuff Luz Estelar invoca un meteorito hacia su posición.\nEl meteorito daña y aplica Luz Estelar a todos los enemigos a su paso.\nCada bala se activa de manera independiente.
stat-extra-utilities-shooting-star.abi-1.name = [#f7d7fc]Presencia de Reisa[]
stat-extra-utilities-shooting-star.abi-1.description = Por cada enemigo con Luz Estelar dentro del alcance de ataque, \ngana un +20% de velocidad de ataque y un −20% de intervalo de ráfaga.

stat-fs-extra-utilities-lightnin-alloy.ammo = Dispara una bala de alta velocidad que deja esferas de iones a lo largo de su trayectoria.\nAl desaparecer, la bala explota, infligiendo daño de área y aturdiendo a las unidades cercanas.\nSe divide en 3 drones que persiguen a los enemigos dentro de un radio de 15 bloques.\nLa unidad flotante impactada también responderá a ciertos estados: \n- Si la unidad tiene Aturdimiento \n┗━ Libera dos partículas adicionales [50 de daño] para perseguir al enemigo \n- Si la unidad está Completamente Rota \n┗━ Las partículas desaparecen, formando un láser [40 de daño] e infligiendo un 25% adicional de daño verdadero \n- Si la unidad tiene Ulificación \n┗━ Las partículas penetran dos objetivos, infligiendo un 0.618% de la salud máxima del objetivo como daño verdadero\nLos drones solo se pueden destruir mediante desintegración; al expirar se autodestruyen causando daño de área.


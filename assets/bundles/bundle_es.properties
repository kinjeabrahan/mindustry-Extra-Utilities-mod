block.extra-utilities-randomer.ea = \
  Proporciona una amplia variedad de objetos y líquidos;con la opción de seleccionar salidas individuales;\
  suministra abundante electricidad y calor;\
  dentro del alcance, las edificaciones pueden anular los estados verdaderos;\
  dentro del alcance, las edificaciones ignoran condiciones de sobrecarga;y obtienen una bonificación de sobrecarga del 200%;\
  las unidades dentro del alcance reciben mejoras - ;Potenciador Territorial, Potenciador de Daño y Potenciador de Defensa;\
  las edificaciones y unidades dentro del alcance;recuperan (0.2% + 15) de salud por fotograma;\
  las unidades aliadas dentro del alcance;son purificadas de debuffs cada segundo;\
  las balas aliadas dentro del alcance;aumentan su daño continuamente con daño directo;\
  repele y daña a las unidades enemigas dentro del alcance;\
  repele y destruye proyectiles enemigos dentro del alcance;\
  20% de probabilidad de reflejar balas entrantes;\
  20% de probabilidad de reflejar el daño;de vuelta al atacante

